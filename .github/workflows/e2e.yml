name: E2E Tests

on:
  # Run on every push to main (site + API changes are exactly what we want to catch)
  push:
    branches: [main]
    paths: ['public/**', 'api/**', 'tests-e2e/**', '.github/workflows/e2e.yml']
  # Weekly scheduled run against prod — catches third-party regressions
  # (tile providers, CDN libs, Supabase, AI provider changes)
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: tests-e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests-e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (desktop)
        working-directory: tests-e2e
        run: npx playwright test --project=chromium

      - name: Run E2E tests (mobile)
        working-directory: tests-e2e
        run: npx playwright test --project=mobile

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 7