name: Apply Supabase Migrations (manual)

# NOTE: Automatic migration is handled by Supabase's native GitHub integration
# (Project → GitHub card). This workflow is kept as a MANUAL FALLBACK only —
# run it from the Actions tab if the integration is unavailable.
# It cannot fire on push, so it can never race the Supabase integration.

on:
  workflow_dispatch: {}   # manual runs only, from the Actions tab

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to Supabase
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
